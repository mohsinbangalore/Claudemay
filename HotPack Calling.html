<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #111111;
    --card: #1a1a1a;
    --card-2: #202020;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --gold: #c9a84c;
    --gold-bright: #ecd185;
    --gold-soft: rgba(201,168,76,0.14);
    --gold-line: rgba(201,168,76,0.42);
    --ink: #f3efe6;
    --ink-2: #b7b2a6;
    --ink-3: #7d786d;
    --green: #5fbf7a;
    --amber: #d9a441;
    --red: #cd6b6b;
    --navy: #243044;
    --r-card: 20px;
    --r-sm: 13px;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Space Grotesk', -apple-system, system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #050505;
    font-family: var(--sans);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  .hp-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .hp-scroll { scrollbar-width: none; }

  .hp-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold);
  }

  .hp-dot { position: relative; border-radius: 50%; flex-shrink: 0; }
  .hp-dot.pulse::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: inherit; animation: hp-pulse 2.2s ease-out infinite;
  }
  @keyframes hp-pulse {
    0% { transform: scale(1); opacity: 0.55; }
    70%,100% { transform: scale(3.2); opacity: 0; }
  }

  .hp-tile {
    transition: transform 140ms cubic-bezier(0.34,1.4,0.6,1),
                border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    will-change: transform;
  }
  .hp-tile:active { transform: scale(0.97); }
  .hp-tile.flash {
    border-color: var(--gold) !important;
    box-shadow: 0 0 0 1px var(--gold), 0 10px 30px rgba(201,168,76,0.16);
    background: linear-gradient(180deg, var(--gold-soft), var(--card)) !important;
  }

  /* Screen transitions — transform-only so content is always visible */
  @keyframes hp-screen-in {
    from { transform: translateX(26px); }
    to   { transform: translateX(0); }
  }
  @keyframes hp-screen-in-back {
    from { transform: translateX(-26px); }
    to   { transform: translateX(0); }
  }
  .anim-ready .hp-screen { animation: hp-screen-in 320ms cubic-bezier(0.22,0.9,0.3,1) both; }
  .anim-ready .hp-screen.back { animation: hp-screen-in-back 320ms cubic-bezier(0.22,0.9,0.3,1) both; }

  /* Staggered tile entrance — transform-only */
  @keyframes hp-rise {
    from { transform: translateY(14px); }
    to   { transform: translateY(0); }
  }
  .anim-ready .hp-rise { animation: hp-rise 420ms cubic-bezier(0.22,0.9,0.3,1) both; }

  /* Chat bubbles */
  @keyframes hp-msg-in {
    from { transform: translateY(10px) scale(0.99); }
    to   { transform: translateY(0) scale(1); }
  }
  .anim-ready .hp-msg { animation: hp-msg-in 360ms cubic-bezier(0.22,0.9,0.3,1) both; }

  @keyframes hp-typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Chip tray — spring treatment (transform-only) */
  @keyframes hp-chip-spring {
    0%   { transform: translateY(26px) scale(0.9); }
    60%  { transform: translateY(-4px) scale(1.03); }
    80%  { transform: translateY(1px) scale(0.995); }
    100% { transform: translateY(0) scale(1); }
  }
  /* Glide treatment */
  @keyframes hp-chip-glide {
    from { transform: translateX(28px); }
    to   { transform: translateX(0); }
  }
  /* Pop treatment */
  @keyframes hp-chip-pop {
    0%   { transform: scale(0.55); }
    65%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .anim-ready .chip-spring { animation: hp-chip-spring 520ms cubic-bezier(0.34,1.56,0.64,1) both; }
  .anim-ready .chip-glide  { animation: hp-chip-glide 300ms cubic-bezier(0.22,0.9,0.3,1) both; }
  .anim-ready .chip-pop    { animation: hp-chip-pop 460ms cubic-bezier(0.34,1.7,0.5,1) both; }

  /* Chip tap fill */
  .hp-chip { transition: transform 130ms cubic-bezier(0.34,1.5,0.6,1); will-change: transform; }
  .hp-chip:active { transform: scale(0.94); }
  @keyframes hp-chip-fill {
    0%   { background: var(--card-2); color: var(--ink); border-color: var(--gold-line); transform: scale(1); }
    35%  { background: var(--gold); color: #1a1407; border-color: var(--gold); transform: scale(1.05); }
    100% { background: var(--gold); color: #1a1407; border-color: var(--gold); transform: scale(0.9); opacity: 0; }
  }
  .hp-chip.firing { animation: hp-chip-fill 280ms cubic-bezier(0.4,0,0.2,1) forwards; }

  /* Shimmer placeholders */
  @keyframes hp-shimmer {
    0% { background-position: -200px 0; }
    100% { background-position: 220px 0; }
  }
  .hp-shimmer {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(201,168,76,0.13) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 220px 100%;
    animation: hp-shimmer 1.1s linear infinite;
  }

  /* Session complete card */
  @keyframes hp-sheet-up {
    from { transform: translateY(40px); }
    to   { transform: translateY(0); }
  }
  .anim-ready .hp-sheet { animation: hp-sheet-up 480ms cubic-bezier(0.22,1.1,0.36,1) both; }
  @keyframes hp-scrim-in { from { opacity: 0; } to { opacity: 1; } }
  .hp-scrim { animation: hp-scrim-in 300ms ease both; }

  @keyframes hp-wave {
    0%, 100% { height: 14px; opacity: 0.5; }
    50% { height: 48px; opacity: 1; }
  }
</style>

  <script>
    /* Gate entrance animations: only add .anim-ready if the frame loop is
       actually running (not paused/offscreen). Content stays visible at rest. */
    (function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      var t0;
      function check(t) {
        if (!t0) { t0 = t; requestAnimationFrame(check); return; }
        if (t - t0 > 1) document.documentElement.classList.add('anim-ready');
      }
      requestAnimationFrame(check);
    })();
  </script>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x:16, y:16 });
  const PAD = 16;
  const clamp = React.useCallback(() => {
    const p = dragRef.current; if (!p) return;
    const w = p.offsetWidth, h = p.offsetHeight;
    offsetRef.current = { x: Math.min(Math.max(PAD, offsetRef.current.x), Math.max(PAD, window.innerWidth-w-PAD)), y: Math.min(Math.max(PAD, offsetRef.current.y), Math.max(PAD, window.innerHeight-h-PAD)) };
    p.style.right = offsetRef.current.x+'px'; p.style.bottom = offsetRef.current.y+'px';
  }, []);
  React.useEffect(() => {
    if (!open) return; clamp();
    window.addEventListener('resize', clamp); return () => window.removeEventListener('resize', clamp);
  }, [open, clamp]);
  React.useEffect(() => {
    const onMsg = e => { const t=e?.data?.type; if(t==='__activate_edit_mode') setOpen(true); else if(t==='__deactivate_edit_mode') setOpen(false); };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*'); };
  const onDragStart = e => {
    const p = dragRef.current; if (!p) return;
    const r = p.getBoundingClientRect(), sx=e.clientX, sy=e.clientY;
    const sr = window.innerWidth-r.right, sb = window.innerHeight-r.bottom;
    const move = ev => { offsetRef.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; clamp(); };
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome="" style={{ right:offsetRef.current.x, bottom:offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}><b>{title}</b><button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const opts = options.map(o => typeof o==='object' ? o : { value:o, label:o });
  const idx = Math.max(0, opts.findIndex(o => o.value===value));
  const n = opts.length;
  const segAt = cx => { const r=trackRef.current.getBoundingClientRect(); return opts[Math.max(0,Math.min(n-1,Math.floor(((cx-r.left-2)/(r.width-4))*n)))].value; };
  const valueRef = React.useRef(value); valueRef.current = value;
  const onPD = e => {
    const v0=segAt(e.clientX); if(v0!==valueRef.current) onChange(v0);
    const move=ev=>{const v=segAt(ev.clientX);if(v!==valueRef.current)onChange(v);};
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  };
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPD} className="twk-seg">
        <div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx} * (100% - 4px) / ${n})`, width:`calc((100% - 4px) / ${n})` }} />
        {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value===value}>{o.label}</button>)}
      </div>
    </div>
  );
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value?'1':'0'} role="switch" aria-checked={!!value} onClick={()=>onChange(!value)}><i/></button>
    </div>
  );
}

// ─── Screen D: Conversation + Chip Tray ──────────────────────────────────────

const HP_CHIPS = {
  billing:   ["It's a charge I don't recognise", "My total looks wrong", "I already paid this", "Show my latest invoice"],
  orders:    ["Give me the live status", "It's later than promised", "Change the details", "It's the wrong items"],
  product:   ["Check stock & lead time", "I need samples first", "Add my branding", "Send the full spec"],
  corporate: ["Connect me to my manager", "I'm opening an account", "Discuss volume pricing", "It's about a tender"],
  complaint: ["It arrived damaged", "There's a quality defect", "This wasn't resolved before", "I want it in writing"],
  general:   ["Point me to the right team", "Just a quick question", "Opening hours & location", "Something else"],
};
const HP_CHIPS_MID = ["That's correct", "There's one more thing", "How long will it take?", "Just get it resolved"];
const HP_CHIPS_CONFIRM = ["Yes, go ahead", "Email me confirmation", "Not yet — one more thing"];

function scriptedTurn(ctx, history) {
  const userTurns = history.filter(m=>m.role==='user').length;
  const { company, dept, role, matter } = ctx;
  const cat = matter.cat || (dept&&dept.cat) || 'general';
  if (history.length===0) {
    const who = role&&role.agent ? `${role.agent.first} here from ${dept.name}. ` : '';
    return { reply:`${who}I can see you're reaching us about "${matter.title}". I've already got your account open — tell me a little more and I'll take it from here.`, chips:(HP_CHIPS[cat]||HP_CHIPS.general).slice(0,4), resolved:false };
  }
  if (userTurns===1) return { reply:`Got it — thanks. I can see exactly what you mean and I've flagged it on your account. Want me to action this for you now?`, chips:HP_CHIPS_MID, resolved:false };
  if (userTurns===2) return { reply:`Perfect. I'll sort that straight away — no need to repeat anything, it's all logged against this matter. Shall I confirm and send you a summary?`, chips:HP_CHIPS_CONFIRM, resolved:false };
  return { reply:`Done — that's been actioned and confirmed. You'll have a summary in your Ainager inbox. Anything else while I'm here?`, resolved:true, summary:[`Matter: ${matter.title}`, role?`Handled by ${role.title}${dept?', '+dept.name:''}`:`Handled by ${dept?dept.name:company.name}`, `Actioned and confirmed — no transfer, no hold`] };
}

function buildPrompt(ctx, history) {
  const { company, dept, role, matter } = ctx;
  const path = [dept&&dept.name, role&&role.title, matter.title].filter(Boolean).join(' › ');
  const transcript = history.map(m=>`${m.role==='agent'?'AGENT':'CUSTOMER'}: ${m.text}`).join('\n');
  return [
    `You are a warm, efficient human-feeling support agent for ${company.name} (${company.domain}), a food-packaging manufacturer.`,
    `You are reached through Ainager — the customer navigated visually to exactly this context, so you ALREADY KNOW why they're here. Never give a generic greeting or ask "how can I help".`,
    `CONTEXT PATH: ${path}`,
    role?`You are the "${role.title}" — ${role.scope}.`:``,
    `MATTER: "${matter.title}"${matter.context?' — '+matter.context:''}.`,
    ``,
    history.length===0
      ? `Write your OPENING line. Start exactly at the matter (reference it specifically), sound human and reassuring, offer to act. 1–2 sentences.`
      : `Continue the conversation. Be concise (1–3 sentences), warm, proactive. Resolve the matter within a couple of turns — confirm actions, don't transfer, don't ask them to repeat themselves.`,
    ``,
    transcript?`CONVERSATION SO FAR:\n${transcript}\n`:``,
    `Reply with STRICT JSON only, no markdown:`,
    `{"reply": string, "chips": [3-4 SHORT first-person things the customer might tap next, each under 6 words], "resolved": boolean, "summary": [if resolved, 2-3 short bullets of what was done]}`,
  ].filter(s=>s!==``).join('\n');
}

function extractJSON(text) {
  if (!text) return null;
  let t = String(text).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s===-1||e===-1) return null;
  try { return JSON.parse(t.slice(s,e+1)); } catch(_) { return null; }
}

async function liveTurn(ctx, history) {
  if (!(window.claude&&typeof window.claude.complete==='function')) throw new Error('no-live');
  const prompt = buildPrompt(ctx, history);
  const raw = await Promise.race([
    window.claude.complete({ messages:[{ role:'user', content:prompt }] }),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),9000)),
  ]);
  const data = extractJSON(raw);
  if (!data||typeof data.reply!=='string') throw new Error('bad-json');
  return { reply:data.reply.trim(), chips:Array.isArray(data.chips)?data.chips.slice(0,4).map(String):[], resolved:!!data.resolved, summary:Array.isArray(data.summary)?data.summary.map(String):null };
}

async function getTurn(ctx, history, mode) {
  if (mode==='scripted') return scriptedTurn(ctx, history);
  try {
    const r = await liveTurn(ctx, history);
    if (!r.chips||!r.chips.length) r.chips = scriptedTurn(ctx, history).chips||[];
    return r;
  } catch(_) { return scriptedTurn(ctx, history); }
}

function ScreenD({ ctx, mode, treatment, showContext=true, onBack, onCompany, onHome }) {
  const [messages, setMessages] = React.useState([]);
  const [chips, setChips] = React.useState([]);
  const [chipsLoading, setChipsLoading] = React.useState(false);
  const [thinking, setThinking] = React.useState(false);
  const [resolvedCtx, setResolvedCtx] = React.useState(null);
  const [listening, setListening] = React.useState(false);
  const [draft, setDraft] = React.useState('');
  const [trayKey, setTrayKey] = React.useState(0);
  const [toast, setToast] = React.useState('');
  const scrollRef = React.useRef(null);
  const histRef = React.useRef([]);

  const path = [ctx.dept&&ctx.dept.name, ctx.role&&ctx.role.title, ctx.matter.title].filter(Boolean).join(' · ');
  const av = (ctx.role&&ctx.role.agent) ? ctx.role.agent.initials : 'HP';

  const pushAgent = text => { histRef.current=[...histRef.current,{role:'agent',text}]; setMessages(m=>[...m,{id:Date.now()+Math.random(),role:'agent',text,av}]); };
  const pushUser = text => { histRef.current=[...histRef.current,{role:'user',text}]; setMessages(m=>[...m,{id:Date.now()+Math.random(),role:'user',text}]); };

  const runAgent = React.useCallback(async () => {
    setChips([]); setChipsLoading(false); setThinking(true);
    const history = histRef.current.slice();
    const minWait = new Promise(r=>setTimeout(r,650));
    const [turn] = await Promise.all([getTurn(ctx, history, mode), minWait]);
    setThinking(false);
    pushAgent(turn.reply);
    if (turn.resolved) {
      setTimeout(()=>setResolvedCtx({ company:ctx.company, summary:turn.summary||scriptedTurn(ctx,histRef.current).summary||[] }), 850);
      return;
    }
    setChipsLoading(true);
    setTimeout(()=>{ setChipsLoading(false); setTrayKey(k=>k+1); setChips(turn.chips||[]); }, 600);
  }, [ctx, mode]);

  React.useEffect(()=>{ runAgent(); }, []);
  React.useEffect(()=>{ const el=scrollRef.current; if(el) el.scrollTop=el.scrollHeight+999; }, [messages,thinking,chips,chipsLoading]);

  const handlePick = text => { setChips([]); pushUser(text); runAgent(); };
  const handleSend = () => { const t=draft.trim(); if(!t) return; setDraft(''); setChips([]); pushUser(t); runAgent(); };
  const handleVoice = () => {
    setListening(true);
    setTimeout(()=>{ setListening(false); handlePick("Yes — that's exactly the matter, please go ahead."); }, 1900);
  };
  const flash = msg => { setToast(msg); setTimeout(()=>setToast(''),1600); };

  return (
    <div className="hp-screen" style={{ height:'100%', display:'flex', flexDirection:'column', background:'var(--bg)', position:'relative' }}>
      <div style={{ flexShrink:0, background:'var(--bg-2)', borderBottom:'1px solid var(--line)', padding:'50px 14px 12px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:11 }}>
          <BackBtn onClick={onBack}/>
          <Avatar initials={av} size={38}/>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
              <span style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontWeight:700, fontSize:19, color:'var(--ink)' }}>{ctx.company.name}</span>
              <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontSize:11, color:'var(--ink-2)' }}>
                <StatusDot state="green" pulse size={6}/> Online · Grok
              </span>
            </div>
            {showContext && <div style={{ fontSize:11, color:'var(--gold)', fontWeight:500, marginTop:3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{path}</div>}
          </div>
          <span style={{ fontSize:9, fontWeight:700, letterSpacing:'0.18em', color:'var(--ink-3)', flexShrink:0 }}>AINAGER</span>
        </div>
      </div>

      <div ref={scrollRef} className="hp-scroll" style={{ flex:1, overflowY:'auto', overflowX:'hidden', padding:'18px 14px 8px', display:'flex', flexDirection:'column', gap:12 }}>
        {messages.map(m=><Bubble key={m.id} m={m}/>)}
        {thinking && <TypingBubble/>}
      </div>

      {!resolvedCtx && (chips.length>0||chipsLoading) && (
        <ChipTray chips={chips} loading={chipsLoading} treatment={treatment} trayKey={trayKey} onPick={handlePick}/>
      )}

      <div style={{ flexShrink:0, padding:'10px 14px 26px', borderTop:'1px solid var(--line)', background:'var(--bg-2)', display:'flex', alignItems:'center', gap:9 }}>
        <button onClick={handleVoice} aria-label="Speak" className="hp-tile" style={{ width:42, height:42, borderRadius:999, flexShrink:0, background:'var(--card-2)', border:'1px solid var(--line-strong)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="var(--gold)" strokeWidth="1.8"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" stroke="var(--gold)" strokeWidth="1.8" strokeLinecap="round"/></svg>
        </button>
        <div style={{ flex:1, display:'flex', alignItems:'center', background:'var(--card)', border:'1px solid var(--line-strong)', borderRadius:999, padding:'0 6px 0 16px' }}>
          <input value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="Type or speak…" style={{ flex:1, background:'transparent', border:'none', outline:'none', color:'var(--ink)', fontFamily:'var(--sans)', fontSize:14, padding:'11px 0' }}/>
          <button onClick={handleSend} aria-label="Send" disabled={!draft.trim()} style={{ width:34, height:34, borderRadius:999, flexShrink:0, border:'none', background:draft.trim()?'var(--gold)':'var(--card-2)', opacity:draft.trim()?1:0.5, display:'flex', alignItems:'center', justifyContent:'center', cursor:draft.trim()?'pointer':'default', transition:'background 150ms, opacity 150ms' }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12h15M12 5l7 7-7 7" stroke={draft.trim()?'#1a1407':'var(--ink-3)'} strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
      </div>

      {listening && <ListeningSheet onCancel={()=>setListening(false)}/>}
      {resolvedCtx && <SessionCard ctx={resolvedCtx} onSave={()=>flash('Summary saved to your inbox')} onRate={()=>flash('Thanks for rating this call')} onCompany={onCompany} onHome={onHome}/>}
      {toast && <div style={{ position:'absolute', left:'50%', bottom:96, transform:'translateX(-50%)', zIndex:80, background:'var(--card)', border:'1px solid var(--gold-line)', color:'var(--ink)', padding:'10px 18px', borderRadius:999, fontSize:12.5, fontWeight:500, boxShadow:'0 10px 30px rgba(0,0,0,0.5)' }}>{toast}</div>}
    </div>
  );
}

// ─── Root App ─────────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "chipMotion": "spring",
  "engine": "auto",
  "showContext": true
}/*EDITMODE-END*/;

function makeMatter(text, cat) {
  return { id:'free-'+Math.random().toString(36).slice(2,7), title:text, context:'', cat, synthetic:true };
}

function ScaledDevice({ children }) {
  const [scale, setScale] = React.useState(1);
  React.useEffect(()=>{
    const fit = () => {
      const m=24, s=Math.min((window.innerWidth-m)/402,(window.innerHeight-m)/874,1.15);
      setScale(s>0?s:1);
    };
    fit(); window.addEventListener('resize',fit); return ()=>window.removeEventListener('resize',fit);
  },[]);
  return (
    <div style={{ width:402*scale, height:874*scale, position:'relative' }}>
      <div style={{ position:'absolute', top:0, left:0, width:402, height:874, transform:`scale(${scale})`, transformOrigin:'top left' }}>
        {children}
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const company = window.HOTPACK;
  const [stack, setStack] = React.useState([{ screen:'A' }]);
  const [dir, setDir] = React.useState('fwd');
  const cur = stack[stack.length-1];

  const push = frame => { setDir('fwd'); setStack(s=>[...s,frame]); };
  const back = () => { setDir('back'); setStack(s=>s.length>1?s.slice(0,-1):s); };
  const reset = () => { setDir('back'); setStack([{ screen:'A' }]); };
  const anim = dir==='back' ? 'back' : '';

  const onDept = dept => push({ screen:'B', dept });
  const onRole = role => push({ screen:'C', dept:cur.dept, role });
  const onMatter = matter => push({ screen:'D', dept:cur.dept, role:cur.role, matter });
  const onQuick = text => push({ screen:'D', dept:cur.dept, role:null, matter:makeMatter(text, cur.dept.cat) });
  const onFreeText = text => {
    const title = text==='__voice__' ? 'Something else I need help with' : text;
    push({ screen:'D', dept:cur.dept, role:cur.role, matter:makeMatter(title, cur.dept.cat) });
  };

  let screen = null;
  if (cur.screen==='A') screen = <ScreenA company={company} anim={anim} onBack={reset} onDept={onDept}/>;
  else if (cur.screen==='B') screen = <ScreenB company={company} dept={cur.dept} anim={anim} onBack={back} onRole={onRole} onQuick={onQuick}/>;
  else if (cur.screen==='C') screen = <ScreenC company={company} dept={cur.dept} role={cur.role} anim={anim} onBack={back} onMatter={onMatter} onFreeText={onFreeText}/>;
  else if (cur.screen==='D') {
    const ctx = { company, dept:cur.dept, role:cur.role, matter:cur.matter };
    const key = (cur.dept?cur.dept.id:'x')+'-'+(cur.role?cur.role.id:'x')+'-'+cur.matter.id;
    screen = <ScreenD key={key} ctx={ctx} mode={t.engine==='scripted'?'scripted':'auto'} treatment={t.chipMotion} showContext={t.showContext} onBack={back} onCompany={reset} onHome={reset}/>;
  }

  return (
    <React.Fragment>
      <ScaledDevice>
        <IOSDevice dark width={402} height={874}>
          {screen}
        </IOSDevice>
      </ScaledDevice>
      <TweaksPanel>
        <TweakSection label="Chip tray"/>
        <TweakRadio label="Motion" value={t.chipMotion} options={['spring','glide','pop']} onChange={v=>setTweak('chipMotion',v)}/>
        <TweakSection label="Conversation"/>
        <TweakRadio label="Engine" value={t.engine} options={['auto','scripted']} onChange={v=>setTweak('engine',v)}/>
        <div style={{ fontSize:11, color:'rgba(41,38,27,0.55)', padding:'2px 2px 8px', lineHeight:1.4 }}>"auto" uses the live model with a scripted fallback. "scripted" forces the deterministic demo flow.</div>
        <TweakToggle label="Show context path" value={t.showContext} onChange={v=>setTweak('showContext',v)}/>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('stage')).render(<App/>);
  </script>
</body>
</html>
