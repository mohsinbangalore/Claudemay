<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ainager — Aster Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500;1,6..96,600&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

/* ───────── STAGE ───────── */
.stage {
  min-height: 100vh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 32px 16px;
  font-family: "Hanken Grotesk", system-ui, sans-serif;
  transition: background .5s ease;
}
.stage[data-theme="editorial"] { background:
  radial-gradient(120% 90% at 50% -10%, #1a1510 0%, #0a0908 55%, #060504 100%); }
.stage[data-theme="aura"] { background:
  radial-gradient(120% 90% at 50% -10%, #f3ecdd 0%, #e7ddcc 55%, #ddd2bd 100%); }

/* ───────── THEME TOKENS ───────── */
[data-theme="editorial"] {
  --bg: #100E0C; --ink: #F3ECDF;
  --muted: rgba(243,236,223,.58); --faint: rgba(243,236,223,.36);
  --line: rgba(243,236,223,.11); --line2: rgba(243,236,223,.07);
  --surface: #1B1714; --surface-2: #241F1A;
  --accent: #E0A92A; --accent-ink: #1A1306; --accent-soft: rgba(224,169,42,.14);
  --cream: #ECE3D2; --cream-ink: #1B1813;
  --doc-av: #1C2C46; --doc-av-ink: #BFD0EA;
  --ok: #4FB477;
  --font-display: "Bodoni Moda", serif; --display-style: italic; --display-weight: 600;
  --orb-bg: radial-gradient(circle at 38% 30%, #FCE292 0%, #E4A82C 42%, #7E520F 100%);
  --orb-glow: 0 0 54px -6px rgba(224,169,42,.6), inset 0 -10px 26px rgba(120,70,8,.5), inset 0 8px 22px rgba(255,235,170,.45);
  --eq-color: rgba(38,26,4,.82);
  --blob1: radial-gradient(circle, rgba(255,228,150,.9), transparent 60%);
  --blob2: radial-gradient(circle, rgba(190,110,40,.8), transparent 60%);
}
[data-theme="aura"] {
  --bg: #EFE7D8; --ink: #211D17;
  --muted: rgba(33,29,23,.6); --faint: rgba(33,29,23,.4);
  --line: rgba(33,29,23,.13); --line2: rgba(33,29,23,.08);
  --surface: #FBF7EF; --surface-2: #FFFFFF;
  --accent: #2E6A57; --accent-ink: #FFFFFF; --accent-soft: rgba(46,106,87,.11);
  --cream: #FBF7EF; --cream-ink: #211D17;
  --doc-av: #E2EDE7; --doc-av-ink: #2E6A57;
  --ok: #2E6A57;
  --font-display: "Instrument Serif", serif; --display-style: normal; --display-weight: 400;
  --orb-bg: radial-gradient(circle at 38% 30%, #FFF3DC 0%, #F3CB8E 38%, #86BBA1 100%);
  --orb-glow: 0 14px 44px -8px rgba(127,184,158,.6), inset 0 -8px 22px rgba(110,150,130,.35), inset 0 8px 20px rgba(255,255,255,.6);
  --eq-color: rgba(33,57,48,.72);
  --blob1: radial-gradient(circle, rgba(255,210,150,.95), transparent 62%);
  --blob2: radial-gradient(circle, rgba(140,190,165,.95), transparent 62%);
}

/* ───────── APP ROOT / SCREENS ───────── */
.app-root { height: 100%; background: var(--bg); }
.screen {
  height: 100%; display: flex; flex-direction: column; min-height: 0;
  background: var(--bg); color: var(--ink);
}
.screen.landing { display: block; overflow-y: auto; }
.screen.landing::-webkit-scrollbar { width: 0; }
.chat-head, .voice-stage, .composer, .confirm-bar { flex-shrink: 0; }
.feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 18px 20px; }
.feed::-webkit-scrollbar { width: 0; }
.feed.center { display: flex; flex-direction: column; align-items: center; }
.feed-label, .section-label {
  font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
  margin: 18px 2px 12px;
}
.kicker {
  font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase;
}

/* ───────── LANDING ───────── */
.biz-band {
  position: relative; overflow: hidden;
  background: var(--cream); color: var(--cream-ink);
  padding: 58px 24px 26px;
}
.back-link {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 15px; font-weight: 600; color: var(--cream-ink);
  opacity: .7; margin-bottom: 26px;
}
.biz-band .kicker { color: rgba(0,0,0,.45); }
.biz-name {
  font-family: var(--font-display); font-style: var(--display-style);
  font-weight: var(--display-weight); font-size: 52px; line-height: .98;
  margin: 6px 0 10px; letter-spacing: -.01em;
}
.biz-tag { font-size: 15.5px; color: rgba(0,0,0,.56); margin: 0; max-width: 78%; }
.watermark {
  position: absolute; right: -14px; top: 6px;
  font-family: var(--font-display); font-style: var(--display-style);
  font-size: 200px; line-height: 1; color: rgba(0,0,0,.05); pointer-events: none;
}
.biz-body { padding: 4px 18px 28px; }
.intent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.intent {
  grid-column: span 1; text-align: left;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; padding: 18px 16px 16px;
  display: flex; flex-direction: column; gap: 12px;
  transition: transform .15s ease, border-color .2s;
}
.intent:active { transform: scale(.975); }
.intent-feat {
  grid-column: 1 / -1; flex-direction: row; align-items: center;
  background: var(--accent); color: var(--accent-ink); border-color: transparent;
  padding: 20px;
}
.intent-ic {
  width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent);
}
.intent-feat .intent-ic { background: rgba(0,0,0,.14); color: var(--accent-ink); }
.intent-txt { flex: 1; }
.intent-title { font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; }
.intent-feat .intent-title { font-size: 19px; }
.intent-desc { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.intent-feat .intent-desc { color: rgba(0,0,0,.6); }
.intent-go {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.16);
}

/* ───────── CHAT HEADER ───────── */
.chat-head {
  display: flex; align-items: center; gap: 12px;
  padding: 56px 16px 12px; border-bottom: 1px solid var(--line2);
  background: var(--bg);
}
.ghost-btn {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); background: var(--accent-soft);
}
.chat-id { flex: 1; display: flex; align-items: center; gap: 10px; }
.chat-name { font-size: 16px; font-weight: 700; }
.chat-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.grok-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--accent); color: var(--accent);
  padding: 6px 10px; border-radius: 999px;
}
.avatar {
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  font-weight: 700; letter-spacing: .02em; flex-shrink: 0;
}
.tone-default { background: var(--surface-2); color: var(--ink); }
.tone-cream { background: var(--cream); color: var(--cream-ink); font-family: var(--font-display); font-style: var(--display-style); }
.tone-doc { background: var(--doc-av); color: var(--doc-av-ink); }

/* ───────── VOICE STAGE ───────── */
.voice-stage {
  display: flex; flex-direction: column; align-items: center;
  padding: 26px 24px 22px; gap: 18px; text-align: center;
  position: relative; background: var(--bg);
}
.voice-stage::after {
  content: ""; position: absolute; left: 18px; right: 18px; bottom: 0;
  height: 1px; background: var(--line2);
}
.voice-stage.slim { padding: 16px 24px 16px; gap: 12px; flex-direction: row; text-align: left; }
.agent-line {
  margin: 0; font-family: var(--font-display); font-style: var(--display-style);
  font-weight: var(--display-weight);
  font-size: 25px; line-height: 1.18; letter-spacing: -.01em; color: var(--ink);
  max-width: 320px;
}
.agent-line.sm { font-size: 19px; flex: 1; }
.caret {
  display: inline-block; width: 2px; height: .92em; vertical-align: -2px;
  background: var(--accent); margin-left: 3px; animation: blink 1s steps(1) infinite;
}
.caret.off { opacity: 0; animation: none; }
@keyframes blink { 50% { opacity: 0; } }

/* ───────── VOICE ORB ───────── */
.voice { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.voice-orb-wrap { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.voice-orb {
  position: relative; border-radius: 50%; overflow: hidden;
  background: var(--orb-bg); box-shadow: var(--orb-glow);
  animation: breathe 4.5s ease-in-out infinite;
}
.blob {
  position: absolute; width: 80%; height: 80%; border-radius: 50%;
  filter: blur(10px); mix-blend-mode: screen; opacity: .8;
}
.blob.b1 { background: var(--blob1); top: -10%; left: -6%; animation: blobA 7s ease-in-out infinite; }
.blob.b2 { background: var(--blob2); bottom: -12%; right: -8%; animation: blobB 8s ease-in-out infinite; }
[data-theme="aura"] .blob { mix-blend-mode: normal; filter: blur(8px); }
.orb-core {
  position: absolute; inset: 18%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.5), transparent 55%);
}
.orb-eq {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 3.5px;
}
.eq-bar {
  width: 3.6px; height: 30%; border-radius: 4px; background: var(--eq-color);
  transform-origin: center; transform: scaleY(.35); transition: transform .35s ease;
}
.ring {
  position: absolute; width: 100%; height: 100%; border-radius: 50%;
  border: 1.5px solid var(--accent); opacity: 0;
}
.voice-bars { display: flex; align-items: center; justify-content: center; gap: 5px; }
.big-bar {
  width: 6px; height: 18%; border-radius: 6px; background: var(--accent);
  transform-origin: center; transform: scaleY(.45); transition: transform .35s ease;
}

/* speaking / listening states */
.v-speaking .voice-orb { animation: breathe 2.4s ease-in-out infinite; }
.v-speaking .ring { animation: ring 2.6s ease-out infinite; }
.v-speaking .r2 { animation-delay: .85s; }
.v-speaking .r3 { animation-delay: 1.7s; }
.v-speaking .eq-bar { animation: eq .72s ease-in-out infinite; animation-delay: calc(var(--i) * -.11s); }
.v-speaking .big-bar { animation: eq .7s ease-in-out infinite; animation-delay: calc(var(--i) * -.09s); }
.v-listening .eq-bar:nth-child(odd) { transform: scaleY(.5); }
.v-listening .big-bar:nth-child(3n) { transform: scaleY(.7); }
@keyframes ring { 0% { transform: scale(.55); opacity: 0; } 16% { opacity: .5; } 100% { transform: scale(1.75); opacity: 0; } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@keyframes blobA { 0%,100% { transform: translate(-8%,-4%) scale(1); } 50% { transform: translate(10%,12%) scale(1.18); } }
@keyframes blobB { 0%,100% { transform: translate(6%,8%) scale(1.05); } 50% { transform: translate(-10%,-6%) scale(.9); } }
.v-calm .voice-orb, .v-calm .ring, .v-calm .eq-bar, .v-calm .big-bar, .v-calm .blob { animation: none !important; }
.v-calm .voice-orb { animation: breathe 6s ease-in-out infinite !important; }

/* ───────── CHIPS ───────── */
.chips-wrap { display: flex; flex-wrap: wrap; gap: 9px; opacity: 0; pointer-events: none; transition: opacity .3s; }
.chips-wrap.show { opacity: 1; pointer-events: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--accent); color: var(--accent);
  background: var(--accent-soft); padding: 9px 13px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; transition: transform .14s, background .2s;
}
.chip:active { transform: scale(.95); }
.chip-ar { opacity: .85; }

/* ───────── BUBBLES ───────── */
.bubble {
  max-width: 80%; padding: 11px 15px; border-radius: 18px; font-size: 15px;
  line-height: 1.35; margin-bottom: 14px;
}
.bubble.user { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }

/* ───────── DOCTOR ROWS ───────── */
.doctors, .chips-wrap { margin-bottom: 4px; }
.doctors { opacity: 0; transition: opacity .35s; }
.doctors.show { opacity: 1; }
.doc-row {
  width: 100%; text-align: left; display: flex; align-items: center; gap: 13px;
  padding: 14px 8px; border-bottom: 1px solid var(--line2);
}
.doc-row:active { background: var(--surface); }
.doc-main { flex: 1; min-width: 0; }
.doc-name { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
.doc-creds { font-size: 12.5px; color: var(--muted); margin: 2px 0 7px; }
.doc-meta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.stars { display: inline-flex; align-items: center; gap: 3px; color: var(--accent); font-size: 12px; }
.stars b { color: var(--ink); font-weight: 700; }
.doc-fee {
  font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted);
  white-space: nowrap;
}
.doc-next {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
  letter-spacing: .04em; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.doc-next.soon { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 45%, transparent); }
.doc-chev { color: var(--faint); flex-shrink: 0; }

/* ───────── BOOKING ───────── */
.booking-doc {
  display: flex; align-items: center; gap: 12px; padding: 4px 4px 16px;
  border-bottom: 1px solid var(--line2);
}
.booking-doc > div:nth-child(2) { flex: 1; }
.slot-group { margin-bottom: 18px; }
.slot-day { display: flex; align-items: baseline; gap: 9px; margin-bottom: 10px; }
.slot-day b { font-size: 14.5px; font-weight: 700; }
.slot-day span { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.slot-times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot {
  padding: 12px 4px; border-radius: 13px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink);
  transition: transform .12s, background .2s, border-color .2s;
}
.slot:active { transform: scale(.94); }
.slot-on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.confirm-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px calc(14px + 22px); border-top: 1px solid var(--line);
  background: var(--surface); transform: translateY(110%); transition: transform .32s cubic-bezier(.3,.9,.3,1);
}
.confirm-bar.show { transform: translateY(0); }
.confirm-info { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.confirm-info svg { color: var(--accent); }
.cta {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--accent); color: var(--accent-ink);
  padding: 13px 20px; border-radius: 999px; font-size: 15px; font-weight: 700;
  transition: transform .14s, opacity .2s;
}
.cta:active { transform: scale(.96); }
.cta:disabled { opacity: .4; }
.cta.wide { width: 100%; justify-content: center; margin-top: 20px; padding: 15px; }

/* ───────── CONFIRMATION TICKET ───────── */
.confirm-screen .feed { padding-bottom: 40px; }
.ticket {
  width: 100%; max-width: 340px; margin-top: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  overflow: hidden;
}
.ticket-top { display: flex; align-items: center; gap: 14px; padding: 22px 22px 18px; }
.ticket-check {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in oklab, var(--ok) 22%, transparent); color: var(--ok);
}
.ticket-title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.ticket-id { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); margin-top: 2px; }
.perf {
  height: 1px; margin: 0 22px; border-top: 1.5px dashed var(--line);
  position: relative;
}
.perf::before, .perf::after {
  content: ""; position: absolute; top: -9px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--bg);
}
.perf::before { left: -31px; } .perf::after { right: -31px; }
.ticket-rows { padding: 16px 22px 6px; }
.t-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 14px; }
.t-row:last-child { border-bottom: none; }
.t-row span { color: var(--muted); }
.t-row b { font-weight: 700; text-align: right; }
.ticket-actions { display: flex; gap: 10px; padding: 8px 18px 20px; }
.t-act {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line); border-radius: 13px; padding: 12px 8px;
  font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface-2);
}
.t-act:active { background: var(--accent-soft); }
.t-act svg { color: var(--accent); }

/* ───────── COMPOSER ───────── */
.composer { background: var(--bg); border-top: 1px solid var(--line2); padding: 10px 14px calc(10px + 22px); }
.quick-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
.quick-row::-webkit-scrollbar { height: 0; }
.quick-chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0;
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.quick-chip svg { color: var(--accent); }
.composer-bar { display: flex; align-items: center; gap: 10px; }
.mic-btn, .send-btn {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.mic-btn { background: var(--accent); color: var(--accent-ink); }
.send-btn { background: var(--surface-2); color: var(--accent); border: 1px solid var(--line); }
.composer-input {
  flex: 1; height: 46px; display: flex; align-items: center;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  padding: 0 18px; font-size: 15px; color: var(--faint);
}

/* ───────── REVEAL ───────── */
.reveal { animation: reveal .5s cubic-bezier(.2,.7,.3,1) both; animation-delay: var(--d, 0ms); }
@keyframes reveal { from { transform: translateY(9px); } to { transform: none; } }

/* ───────── IOS DEVICE FRAME ───────── */
.device-frame {
  width: 390px; height: 844px; border-radius: 48px; overflow: hidden;
  position: relative;
  box-shadow: 0 40px 80px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.14);
  background: var(--bg);
  flex-shrink: 0;
}
.device-island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50;
  pointer-events: none;
}
.device-statusbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px 0; pointer-events: none;
  font-family: -apple-system, "SF Pro", system-ui; font-weight: 590; font-size: 15px;
}
.device-home {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 139px; height: 5px; border-radius: 100px;
  background: rgba(255,255,255,.4); z-index: 60; pointer-events: none;
}
[data-theme="aura"] .device-home { background: rgba(0,0,0,.22); }
.device-content {
  position: absolute; inset: 0; display: flex; flex-direction: column;
}

/* ───────── TWEAKS PANEL (minimal inline version) ───────── */
.twk-panel {
  position: fixed; right: 16px; bottom: 16px; z-index: 9999;
  background: rgba(250,249,247,.9); color: #29261b;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: .5px solid rgba(255,255,255,.6); border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
  font: 12px/1.4 ui-sans-serif, system-ui, sans-serif;
  width: 240px; padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.twk-title { font-size: 12px; font-weight: 600; letter-spacing: .01em; margin-bottom: 2px; }
.twk-row { display: flex; flex-direction: column; gap: 5px; }

          <div className="orb-eq">
            {Array.from({ length: bars }).map((_, i) => (

/* ─── TYPEWRITER ─── */
function useTypewriter(text, speed = 22, startDelay = 120) {
  const [shown, setShown] = useState("");
  const [done, setDone] = useState(false);
  useEffect(() => {
    setShown(""); setDone(false);
    let i = 0; let t;
    const start = setTimeout(function tick() {
      i++; setShown(text.slice(0, i));
      if (i < text.length) t = setTimeout(tick, speed);
      else setDone(true);
    }, startDelay);
    return () => { clearTimeout(start); clearTimeout(t); };
  }, [text]);
  return [shown, done];
}

function Conversation({ business, doctors, quickIntents, intent, onBack, onPickDoctor, voiceVariant, calm }) {
  const greet = intent && intent.id !== "book"

    : "I'll find the doctors with open slots right now, Muhsin.";
  const [line, done] = useTypewriter(greet, 20, 500);
  const speaking = !done;
  const [userMsg, setUserMsg] = useState(null);
  const chips = ["Book the next slot", "Check other times", "Find a different clinic"];

  return (
    <div className="screen chat">
      <ChatHeader business={business} onBack={onBack} />
      <div className="voice-stage">
        <VoiceHero state={speaking ? "speaking" : "listening"} variant={voiceVariant} calm={calm} size={108} />

      </div>
      <div className="feed">
        {userMsg && <div className="bubble user reveal">{userMsg}</div>}
        <div className={`chips-wrap ${done ? "show" : ""}`}>
          {chips.map((c, i) => (
            <div key={c} className="reveal" style={{ "--d": `${i * 60}ms` }}>

          <div className="feed-label">Available doctors</div>
          {doctors.map((d, i) => (

        </div>
      </div>
      <Composer quickIntents={quickIntents} onQuick={() => {}} />
    </div>
  );
}

function Booking({ business, doctor, slots, onBack, onConfirm, voiceVariant, calm }) {
  const [sel, setSel] = useState(null);
  const line = sel
    ? `That's ${sel.day} ${sel.date} at ${sel.time}. Shall I confirm it?`
    : `Booking with ${doctor.name} for ${doctor.dept.toLowerCase()}. Pick a time that works.`;

  return (
    <div className="screen booking">
      <ChatHeader business={business} onBack={onBack} />
      <div className="voice-stage slim">
        <VoiceHero state={sel ? "speaking" : "listening"} variant={voiceVariant} calm={calm} size={72} />
        <p className="agent-line sm">{line}</p>
      </div>
      <div className="feed">
        <div className="booking-doc">
          <AvatarMono text={doctor.initials} tone="doc" size={42} />

            <div className="doc-name">{doctor.name}</div>
            <div className="doc-creds">{doctor.dept} · AED {doctor.fee}</div>
          </div>
          <Stars rating={doctor.rating} />
        </div>
        <div className="feed-label">Available slots</div>
        {slots.map((grp) => (
          <div className="slot-group" key={grp.day}>
            <div className="slot-day"><b>{grp.day}</b><span>{grp.date}</span></div>
            <div className="slot-times">
              {grp.times.map((t) => {
                const on = sel && sel.day === grp.day && sel.time === t;
                return (
                  <button key={t} className={`slot ${on ? "slot-on" : ""}`}
                    onClick={() => setSel({ day: grp.day, date: grp.date, time: t })}
                  >{t}</button>
                );
              })}
            </div>
          </div>
        ))}
        <div style={{ height: 16 }} />
      </div>
      <div className={`confirm-bar ${sel ? "show" : ""}`}>
        <div className="confirm-info">
          <Icon name="clock" size={18} />

        <button className="cta" disabled={!sel} onClick={() => sel && onConfirm(sel)}>
          Confirm <Icon name="arrowUR" size={17} />
        </button>
      </div>
    </div>
  );
}

function Confirmation({ business, doctor, slot, location, onDone, onBack, voiceVariant, calm }) {
  const apt = "APT-873246";
  const [line] = useTypewriter("You're all set, Muhsin. I'll send a reminder a day before.", 20, 400);
  const rows = [

        </div>

      <div className="twk-toggle-row">
        <div className="twk-lbl">Calm motion</div>
        <button className="twk-toggle" data-on={calmMotion ? "1" : "0"}
          onClick={() => setCalmMotion(!calmMotion)}><i /></button>
      </div>
    </div>
  );
}

/* ─── APP ─── */
function App() {
  const D = DATA;
  const [theme, setTheme] = useState("editorial");
  const [voiceStyle, setVoiceStyle] = useState("orb");
  const [calmMotion, setCalmMotion] = useState(false);

  const [screen, setScreen] = useState("landing");
  const [intent, setIntent] = useState(null);
  const [doctor, setDoctor] = useState(null);
  const [slot, setSlot] = useState(null);
  const [flash, setFlash] = useState(0);

  const openIntent = (it) => { setIntent(it); setScreen("chat"); setFlash(f => f + 1); };
  const pickDoctor = (d) => { setDoctor(d); setScreen("booking"); };
  const confirm = (s) => { setSlot(s); setScreen("confirmed"); };
  const reset = () => { setScreen("landing"); setIntent(null); setDoctor(null); setSlot(null); };

  const dark = theme === "editorial";
  const variant = voiceStyle;
  const calm = calmMotion;

  return (
    <div className="stage" data-theme={theme}>
      <DeviceFrame dark={dark}>
        <div className="app-root">
          {screen === "landing" && (
            <Landing business={D.business} intents={D.intents} onOpen={openIntent} onHome={() => { window.location.href = "../index.html"; }} />
          )}
          {screen === "chat" && (
            <Conversation
              key={flash}
              business={D.business} doctors={D.doctors} quickIntents={D.quickIntents}
              intent={intent} onBack={reset} onPickDoctor={pickDoctor}
              voiceVariant={variant} calm={calm}
            />
          )}
          {screen === "booking" && doctor && (
            <Booking
              business={D.business} doctor={doctor} slots={D.slots[doctor.id]}
              onBack={() => setScreen("chat")} onConfirm={confirm}
              voiceVariant={variant} calm={calm}
            />
          )}
          {screen === "confirmed" && doctor && slot && (
            <Confirmation
              business={D.business} doctor={doctor} slot={slot} location={D.location}
              onDone={reset} onBack={() => setScreen("booking")}
              voiceVariant={variant} calm={calm}
            />
          )}
        </div>
      </DeviceFrame>

      <TweaksPanel
        theme={theme} setTheme={setTheme}
        voiceStyle={voiceStyle} setVoiceStyle={setVoiceStyle}
        calmMotion={calmMotion} setCalmMotion={setCalmMotion}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
